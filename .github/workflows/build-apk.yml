name: Build Debug APK for Android TV

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🛡️ Configurar entorno (Keystore, .env y Licencias SDK)
        run: |
          echo "=== 1. Permisos del wrapper de Gradle ==="
          chmod +x gradlew || true

          echo "=== 2. Configurar debug.keystore ==="
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decodificando debug.keystore desde debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generando debug.keystore estándar de desarrollo..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          echo "=== 3. Configurar archivo .env para Secrets Gradle Plugin ==="
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          echo "=== 4. Aceptar licencias de Android SDK ==="
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🔨 Compilar APK Depurada (:app:assembleDebug)
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: 🔍 Localizar y Verificar APK generada
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*debug*.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ Error crítico: No se encontró el archivo APK generado."
            exit 1
          fi
          echo "✅ APK generada con éxito: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          ls -lh "$APK_PATH"

      - name: 📦 Subir APK a Artefactos de GitHub (Descarga zip)
        uses: actions/upload-artifact@v4
        with:
          name: NovaTV-Launcher-v1.5-debug
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: 🚀 Publicar APK en GitHub Releases (Descarga directa .apk)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.5-build${{ github.run_number }}"
          cp "${{ steps.find_apk.outputs.apk_path }}" ./NovaTV-Launcher-v1.5.apk
          
          echo "Publicando release con el binario .apk directo..."
          gh release create "$TAG_NAME" \
            ./NovaTV-Launcher-v1.5.apk \
            --title "Nova TV Launcher v1.5 (Build #${{ github.run_number }})" \
            --notes "### 🚀 APK Depurada para Android TV
          - Descarga directa: **NovaTV-Launcher-v1.5.apk** (no comprimido, listo para instalar).
          - Iconos reales de aplicaciones instaladas.
          - Desplazamiento vertical fluido en la cuadrícula de apps sin cortes.
          - Panel animado y reducido de Rendimiento y Eficiencia Energética en Configuración.
          - Borrado automático de PIN ante errores para reintentar al instante.
          - Opción integrada para seleccionar Nova TV Launcher como launcher por defecto." \
            --latest || true
